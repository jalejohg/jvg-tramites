name: Notify infrastructure

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy-website event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: jalejohg/saas-core-infrastructure
          event-type: deploy-website
          client-payload: |-
            {
              "tenant": "${{ vars.TENANT_SLUG }}",
              "repo": "${{ github.repository }}",
              "build_dir": "frontend"
            }
